subprojects {
	apply plugin: 'java'

	tasks.withType(JavaCompile).configureEach {
		options.encoding = 'UTF-8'
		options.release = 25
	}

	java {
		withSourcesJar()
	}

	sourceSets.main {
		java.srcDir rootProject.file('common/src/main/java')
		resources.srcDir rootProject.file('common/src/main/resources')
	}

	jar {
		from(rootProject.file('LICENSE'))
	}
}
